<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Motif de fond « open space » : 25 objets de bureau au trait, monochromes.
       La tuile fait 400×400 et se répète ; aucun dessin ne touche les bords,
       le raccord est donc invisible. L'opacité est réglée par la variable CSS
       doodle-opacity, et par AppBackground côté iOS. -->
  <g fill="none" stroke="#8594a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Rangée 1 -->
    <g transform="translate(16 20) rotate(-7)"><!-- tasse et soucoupe -->
      <path d="M2 6 h20 v9 a6 6 0 0 1-6 6 H8 a6 6 0 0 1-6-6 z"/>
      <path d="M22 8 a5 5 0 0 1 0 9"/>
      <path d="M0 24 h26"/>
      <path d="M7 1 q3 -3 0 -6"/><path d="M14 1 q3 -3 0 -6"/>
    </g>
    <g transform="translate(96 22) rotate(5)"><!-- imprimante -->
      <rect x="0" y="9" width="30" height="14" rx="2"/>
      <path d="M6 9 V2 h18 v7"/>
      <rect x="6" y="18" width="18" height="11"/>
      <circle cx="26" cy="13" r="1.2"/>
      <path d="M10 22 h10 M10 26 h7"/>
    </g>
    <g transform="translate(176 18) rotate(-4)"><!-- écran sur pied -->
      <rect x="0" y="0" width="32" height="21" rx="2"/>
      <path d="M13 21 v5 h6 v-5"/>
      <path d="M8 26 h16"/>
      <path d="M5 6 h14 M5 11 h9"/>
    </g>
    <g transform="translate(258 24) rotate(9)"><!-- gobelet à emporter -->
      <path d="M2 5 h16 l-2 19 a3 3 0 0 1-3 3 H7 a3 3 0 0 1-3-3 z"/>
      <path d="M0 5 h20"/>
      <path d="M6 5 V1 h8 v4"/>
    </g>
    <g transform="translate(330 20) rotate(-10)"><!-- chemise / dossier -->
      <path d="M0 4 h11 l3 4 h15 a2 2 0 0 1 2 2 v14 a2 2 0 0 1-2 2 H2 a2 2 0 0 1-2-2 z"/>
      <path d="M0 12 h31"/>
    </g>

    <!-- Rangée 2 -->
    <g transform="translate(22 104) rotate(6)"><!-- chaise de bureau -->
      <path d="M6 0 h16 a2 2 0 0 1 2 2 v11 H4 V2 a2 2 0 0 1 2-2"/>
      <path d="M2 13 h24 a2 2 0 0 1 2 2 v3 H0 v-3 a2 2 0 0 1 2-2"/>
      <path d="M14 18 v7"/>
      <path d="M5 30 l9 -5 l9 5"/>
      <circle cx="4" cy="31" r="1.6"/><circle cx="24" cy="31" r="1.6"/>
    </g>
    <g transform="translate(100 110) rotate(-5)"><!-- pile de documents -->
      <path d="M0 8 h26 v18 H0 z"/>
      <path d="M3 4 h26 v18"/>
      <path d="M6 0 h26 v18"/>
      <path d="M5 14 h16 M5 19 h11"/>
    </g>
    <g transform="translate(182 108) rotate(8)"><!-- clavier -->
      <rect x="0" y="0" width="34" height="18" rx="2"/>
      <path d="M4 5 h4 M11 5 h4 M18 5 h4 M25 5 h5"/>
      <path d="M4 10 h6 M13 10 h4 M20 10 h10"/>
      <path d="M9 14 h16"/>
    </g>
    <g transform="translate(262 106) rotate(-8)"><!-- plante en pot -->
      <path d="M5 14 h16 l-2 14 H7 z"/>
      <path d="M13 14 V6"/>
      <path d="M13 9 q-8 -1 -9 -8 q8 0 9 8"/>
      <path d="M13 11 q8 -2 9 -9 q-8 1 -9 9"/>
    </g>
    <g transform="translate(336 108) rotate(4)"><!-- horloge murale -->
      <circle cx="12" cy="12" r="11.5"/>
      <path d="M12 5 V12 h5"/>
    </g>

    <!-- Rangée 3 -->
    <g transform="translate(18 190) rotate(-12)"><!-- trombone -->
      <path d="M4 5 v17 a6 6 0 0 0 12 0 V6 a4 4 0 0 0-8 0 v15"/>
    </g>
    <g transform="translate(92 188) rotate(7)"><!-- agrafeuse -->
      <path d="M0 20 h32 a2 2 0 0 1 2 2 v3 H2 a2 2 0 0 1-2-2 z"/>
      <path d="M3 20 l4 -9 h22 a2 2 0 0 1 2 2 v7"/>
      <path d="M8 13 h18"/>
    </g>
    <g transform="translate(170 186) rotate(-6)"><!-- post-it -->
      <path d="M0 0 h26 v18 l-8 8 H0 z"/>
      <path d="M26 18 h-8 v8"/>
      <path d="M5 7 h15 M5 12 h11"/>
    </g>
    <g transform="translate(250 188) rotate(10)"><!-- souris -->
      <path d="M11 0 a11 11 0 0 1 11 11 v9 a11 11 0 0 1-22 0 v-9 A11 11 0 0 1 11 0"/>
      <path d="M11 0 v10"/>
      <path d="M0 10 h22"/>
    </g>
    <g transform="translate(324 190) rotate(-5)"><!-- mug simple -->
      <path d="M0 0 h22 v20 a4 4 0 0 1-4 4 H4 a4 4 0 0 1-4-4 z"/>
      <path d="M22 4 a6 6 0 0 1 0 12"/>
      <path d="M6 8 h10"/>
    </g>

    <!-- Rangée 4 -->
    <g transform="translate(20 270) rotate(8)"><!-- calculatrice -->
      <rect x="0" y="0" width="22" height="30" rx="2"/>
      <rect x="4" y="4" width="14" height="6"/>
      <circle cx="6" cy="16" r="1.3"/><circle cx="11" cy="16" r="1.3"/><circle cx="16" cy="16" r="1.3"/>
      <circle cx="6" cy="22" r="1.3"/><circle cx="11" cy="22" r="1.3"/><circle cx="16" cy="22" r="1.3"/>
    </g>
    <g transform="translate(88 272) rotate(-9)"><!-- crayon -->
      <path d="M6 28 L26 8 l-4 -4 L2 24 z"/>
      <path d="M2 24 l4 4"/>
      <path d="M22 4 l4 4"/>
    </g>
    <g transform="translate(160 268) rotate(5)"><!-- classeur à anneaux -->
      <path d="M4 0 h24 v30 H4 a4 4 0 0 1-4 -4 V4 a4 4 0 0 1 4 -4"/>
      <path d="M8 0 v30"/>
      <circle cx="4" cy="9" r="1.6"/><circle cx="4" cy="21" r="1.6"/>
      <path d="M13 8 h11 M13 13 h8"/>
    </g>
    <g transform="translate(238 270) rotate(-7)"><!-- corbeille à papier -->
      <path d="M0 0 h24 l-3 28 H3 z"/>
      <path d="M7 6 v16 M12 6 v16 M17 6 v16"/>
    </g>
    <g transform="translate(312 268) rotate(6)"><!-- enveloppe -->
      <rect x="0" y="0" width="30" height="20" rx="2"/>
      <path d="M0 3 L15 12 L30 3"/>
    </g>

    <!-- Rangée 5 -->
    <g transform="translate(24 348) rotate(-6)"><!-- ampoule -->
      <path d="M10 0 a9 9 0 0 1 5 16 q-1 1 -1 3 H6 q0 -2 -1 -3 A9 9 0 0 1 10 0"/>
      <path d="M6 22 h8 M7 26 h6"/>
    </g>
    <g transform="translate(96 350) rotate(9)"><!-- tampon encreur -->
      <path d="M4 22 h20 v5 H4 z"/>
      <path d="M8 22 l2 -9 h8 l2 9"/>
      <path d="M11 13 V6 a3 3 0 0 1 6 0 v7"/>
    </g>
    <g transform="translate(168 346) rotate(-4)"><!-- calendrier -->
      <rect x="0" y="4" width="28" height="24" rx="2"/>
      <path d="M0 11 h28"/>
      <path d="M7 4 V0 M21 4 V0"/>
      <path d="M6 17 h4 M14 17 h4 M6 22 h4 M14 22 h8"/>
    </g>
    <g transform="translate(246 348) rotate(7)"><!-- tasse vue de dessus -->
      <circle cx="12" cy="12" r="11.5"/>
      <circle cx="12" cy="12" r="7"/>
      <path d="M23 8 a5 5 0 0 1 0 8"/>
    </g>
    <g transform="translate(320 344) rotate(-8)"><!-- machine à café -->
      <path d="M0 2 h28 v10 H0 z"/>
      <path d="M4 12 v10 h20 V12"/>
      <path d="M10 22 h8 v6 h-8 z"/>
      <path d="M14 12 v4"/>
      <path d="M0 28 h28"/>
    </g>

  </g>
</svg>
